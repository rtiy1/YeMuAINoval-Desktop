name: Build macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match the version used to generate packages/mcode/bun.lock.
          bun-version: 1.3.5

      - name: Install root dependencies (npm)
        run: npm ci
        env:
          # GitHub-hosted macOS runners terminate TLS with a self-signed proxy
          # cert; electron's postinstall download (github.com releases) needs
          # this relaxed to complete.
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Prepare mcode runtime dependencies
        # bun install inside the npm workspace hoists to the repo root; the
        # script installs in an isolated copy so packages/mcode/node_modules
        # is self-contained for the packaged app.
        run: bash scripts/prepare-mcode.sh

      - name: Build bridge (TS -> dist)
        run: npm -w @yemu/bridge run build

      - name: Build macOS app (ad-hoc signed)
        run: npm run build:mac
        env:
          # vite/rollup on this app exceeds Node's default heap
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
