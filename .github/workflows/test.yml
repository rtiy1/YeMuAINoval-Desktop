name: Test

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-local-smoke:
    name: Run Web + Local Brain Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Run web + local brain smoke
        run: bash scripts/smoke-web-local-brain.sh

  frontend-quality:
    name: Run Frontend Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Run type check
        run: npm run type-check

      - name: Check Electron Access Guard
        run: bash scripts/check-electron-access.sh

      - name: Design tokens (engine + no hard-coded colors in UI)
        run: npm run check:design-token-usage

  bridge:
    name: Run Bridge Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run bridge type check
        run: npm -w @yemu/bridge run typecheck
